name: Docs site

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing a commit.
  workflow_dispatch:

# The site is public output; nothing here needs write access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let a running one finish rather than
# cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v6

      - name: Build the site
        # A project site lives under /<repo>, so every link and asset URL has to
        # carry that prefix. Empty in local builds.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npx vite build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
