name: Docs site

# Deploys only what CI has passed: the site is built from the commit of a green
# CI run on main, so a change that fails its checks never reaches the site.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Lets you redeploy the current main by hand.
  workflow_dispatch:

# The site is public output; nothing here needs write access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let a running one finish rather than
# cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A CI run on main also completes when it fails or is cancelled.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI checked, which may be older than the tip of main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v6

      - name: Build the site
        # A project site lives under /<repo>, so every link and asset URL has to
        # carry that prefix. Empty in local builds.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npx vite build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
