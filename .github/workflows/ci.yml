name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first one.
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # The component suite drives a real MapLibre map instead of a mock, so a
      # browser with WebGL is a hard requirement rather than an optimisation.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Builds the distributable and validates the published surface with publint.
      - name: Package
        run: npm run prepack
